; Video Landscaper settings, shared by the GUI and CLI.
; The app copies these defaults to the per-user settings folder on first launch.
; On Windows: %APPDATA%\VideoLandscaper\VideoLandscaper.ini
; Edit that per-user file, then restart the app to apply your changes.

[Encoding]
; Set to true, to use the following settings for older TVs:
; H.264 High profile, Level 4.0, yuv420p, CRF 20, maxrate 10M,
; bufsize 10M, and 3 reference frames. CRF 20 overrides the CLI --crf value.
; Sizing and frame rate are unchanged; original audio is still copied unless
; the CLI --audio-bitrate option requests AAC. MP4 faststart remains enabled.
; false preserves the normal encoding settings (including the default CRF 18).

legacy_tv_compatibility = false
